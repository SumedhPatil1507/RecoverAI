global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: recoverai
    environment: local

scrape_configs:
  - job_name: recoverai-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
