[theme]
base                     = "dark"
primaryColor             = "#4285f4"
backgroundColor          = "#0d1b2a"
secondaryBackgroundColor = "#0a1628"
textColor                = "#c9d1d9"
font                     = "sans serif"

[server]
headless             = true   # required for all cloud deployments
enableCORS           = true   # must be true when enableXsrfProtection = true
enableXsrfProtection = true
maxUploadSize        = 10

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
