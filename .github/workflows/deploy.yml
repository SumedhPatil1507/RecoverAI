###############################################################################
# RecoverAI Enterprise – Multi-Stage CI/CD Pipeline
###############################################################################
#
# Stages (in order):
#   1. lint          – ruff syntax/style check
#   2. security      – Bandit SAST scan (fails on HIGH severity)
#   3. test          – Import smoke tests + unit tests
#   4. docker-build  – Build & push Docker image to ECR (main branch only)
#   5. tf-validate   – Terraform fmt + validate (all branches)
#   6. tf-plan       – Terraform plan against staging (main branch only)
#   7. tf-apply      – Terraform apply to staging (main branch, after approval)
#   8. deploy        – kubectl rollout to EKS (main branch, after tf-apply)
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID          – IAM key for CI role (recoverai-ci)
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                 – e.g. ap-south-1
#   ECR_REGISTRY               – 123456789.dkr.ecr.ap-south-1.amazonaws.com
#   EKS_CLUSTER_NAME
#   TF_VAR_razorpay_webhook_secret
#   TF_VAR_openai_api_key
#   TF_VAR_audit_hmac_key
#   DOCKERHUB_USERNAME         – fallback Docker Hub credentials
#   DOCKERHUB_TOKEN
###############################################################################

name: RecoverAI Enterprise CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: recoverai-enterprise
  TF_WORKING_DIR: ./terraform
  TF_VERSION: "1.7.4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

###############################################################################
# JOB 1 – Lint (ruff)
###############################################################################
jobs:
  lint:
    name: "1 · Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        run: |
          ruff check recover_ai/ streamlit_app.py --output-format=github \
            --ignore E501,E402,F401

###############################################################################
# JOB 2 – Security scan (Bandit)
###############################################################################
  security:
    name: "2 · Security (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit[toml]==1.7.8

      - name: Run Bandit SAST
        run: |
          bandit -r recover_ai/ \
            -ll \
            --severity-level high \
            --confidence-level high \
            --exclude recover_ai/__pycache__,recover_ai/integrations/__pycache__ \
            -f json -o bandit-report.json || true
          # Surface results and fail on HIGH severity
          python - <<'EOF'
          import json, sys
          try:
              report = json.load(open("bandit-report.json"))
          except Exception:
              print("No Bandit report generated — OK")
              sys.exit(0)
          high = [r for r in report.get("results", []) if r.get("issue_severity") == "HIGH"]
          if high:
              print(f"BANDIT: {len(high)} HIGH-severity issue(s) found:")
              for r in high:
                  print(f"  [{r['test_id']}] {r['filename']}:{r['line_number']} — {r['issue_text']}")
              sys.exit(1)
          print(f"Bandit passed. {len(report.get('results', []))} lower-severity findings (non-blocking).")
          EOF

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

###############################################################################
# JOB 3 – Tests (import smoke + unit)
###############################################################################
  test:
    name: "3 · Tests"
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check — all Python files
        run: |
          for f in \
            recover_ai/config.py \
            recover_ai/schemas.py \
            recover_ai/security.py \
            recover_ai/database.py \
            recover_ai/ml_scorer.py \
            recover_ai/agent_engine.py \
            recover_ai/queue_worker.py \
            recover_ai/main.py \
            recover_ai/data_simulator.py \
            recover_ai/merchant_copilot.py \
            recover_ai/explainability.py \
            recover_ai/recovery_optimization.py \
            recover_ai/experimentation.py \
            recover_ai/anomaly_detection.py \
            recover_ai/integrations/razorpay_links.py \
            recover_ai/integrations/whatsapp_notifier.py \
            streamlit_app.py; do
            python -m py_compile "$f" && echo "  OK  $f"
          done

      - name: Import smoke tests
        working-directory: recover_ai
        run: |
          python -c "
          from config import get_settings
          s = get_settings()
          assert s.app_version, 'version missing'
          print('config OK:', s.app_version)
          "
          python -c "
          from schemas import (PaymentFailurePayload, RecoveryAction,
                               TransactionStatus, HITLQueueItem, HITLDecision)
          assert TransactionStatus.PENDING_APPROVAL
          assert TransactionStatus.REJECTED
          print('schemas OK — PENDING_APPROVAL + REJECTED present')
          "
          python -c "
          import database
          print('database OK')
          "
          python -c "
          from security import redact_pii, verify_razorpay_signature
          assert redact_pii({'email': 'test@example.com'})['email'] != 'test@example.com'
          print('security OK — PII redaction working')
          "
          python -c "
          from ml_scorer import MLRecoveryScorer
          s = MLRecoveryScorer.get()
          score = s.score(5000.0, 'GATEWAY_ERROR', 0, 14)
          assert 0.0 <= score <= 1.0, f'bad score: {score}'
          print(f'ml_scorer OK — score={score}')
          "
          python -c "
          from integrations.razorpay_links import RazorpayLinksClient, PaymentLinkRequest, PaymentLinkCustomer
          client = RazorpayLinksClient(mock=True)
          req = PaymentLinkRequest(
              amount_rupees=999.0,
              description='test',
              customer=PaymentLinkCustomer(email='test@example.com'),
              reference_id='pay_test123',
          )
          result = client.create(req)
          assert result.status == 'created'
          assert 'rzp.io' in result.short_url
          print('razorpay_links OK — mock link:', result.short_url)
          "
          python -c "
          from merchant_copilot import validate_sql
          assert validate_sql('DELETE FROM transactions')[0] is False
          print('merchant_copilot OK — read-only SQL validation working')
          "
          python -c "
          from recovery_optimization import recommend
          result = recommend({'amount_paise': 100000, 'recoverability_score': 0.5, 'failure_category': 'GATEWAY_DOWN'})
          assert 0 < result['expected_success_probability'] <= 1
          print('recovery_optimization OK — recommendation generated')
          "
          python -c "
          from experimentation import record, report
          record('retry_now', True, 1000, 1, 10)
          assert report()['strategies'][0]['recovered'] >= 1
          print('experimentation OK — outcome recorded')
          "
          python -c "
          from anomaly_detection import detect
          assert 'anomalies' in detect([])
          print('anomaly_detection OK — scanner available')
          "
          python -c "
          from integrations.whatsapp_notifier import NotificationDispatcher, DispatchRequest, DispatchChannel, DispatchStatus
          d = NotificationDispatcher()
          req = DispatchRequest(
              recipient_phone='+919876543210',
              recipient_email='test@example.com',
              recipient_name='Test User',
              payment_id='pay_test',
              amount_rupees=999.0,
              payment_link='https://rzp.io/i/test',
              channels=[DispatchChannel.WHATSAPP],
          )
          results = d.dispatch(req)
          assert results[0].status == DispatchStatus.MOCK
          print('whatsapp_notifier OK — mock dispatch:', results[0].dispatch_id)
          "

      - name: Unit tests (pytest)
        run: |
          pip install pytest pytest-asyncio
          # Run only if tests/ directory exists
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests/ directory found — skipping pytest (smoke tests passed above)"
          fi

###############################################################################
# JOB 4 – Docker build & push
###############################################################################
  docker:
    name: "4 · Docker Build & Push"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      # Push to ECR on main, Docker Hub as fallback
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub (fallback / PR builds)
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.ECR_REGISTRY }}/recoverai-enterprise
            ${{ secrets.DOCKERHUB_USERNAME }}/recoverai-enterprise
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Output image URI
        run: |
          echo "image_uri=${{ secrets.ECR_REGISTRY }}/recoverai-enterprise:sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

###############################################################################
# JOB 5 – Terraform validate (all branches)
###############################################################################
  tf-validate:
    name: "5 · Terraform Validate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (local backend for validation)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3
      - run: |
          cd ${{ env.TF_WORKING_DIR }}
          tflint --init
          tflint --format compact || true

###############################################################################
# JOB 6 – Terraform plan (main branch)
###############################################################################
  tf-plan:
    name: "6 · Terraform Plan (staging)"
    runs-on: ubuntu-latest
    needs: [docker, tf-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_razorpay_webhook_secret: ${{ secrets.TF_VAR_razorpay_webhook_secret }}
          TF_VAR_openai_api_key:          ${{ secrets.TF_VAR_openai_api_key }}
          TF_VAR_audit_hmac_key:          ${{ secrets.TF_VAR_audit_hmac_key }}
        run: |
          terraform plan \
            -var-file=environments/staging.tfvars \
            -out=tfplan \
            -input=false \
            -lock-timeout=60s

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-staging
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

###############################################################################
# JOB 7 – Terraform apply (main branch, requires manual approval in GitHub UI)
###############################################################################
  tf-apply:
    name: "7 · Terraform Apply (staging)"
    runs-on: ubuntu-latest
    needs: tf-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://recoverai-staging.example.com

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-staging
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_razorpay_webhook_secret: ${{ secrets.TF_VAR_razorpay_webhook_secret }}
          TF_VAR_openai_api_key:          ${{ secrets.TF_VAR_openai_api_key }}
          TF_VAR_audit_hmac_key:          ${{ secrets.TF_VAR_audit_hmac_key }}
        run: terraform apply -auto-approve -input=false tfplan

###############################################################################
# JOB 8 – Deploy to EKS
###############################################################################
  deploy:
    name: "8 · Deploy to EKS (staging)"
    runs-on: ubuntu-latest
    needs: [tf-apply, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://recoverai-staging.example.com

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION || 'ap-south-1' }} \
            --name   ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Set image tag in manifests
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/recoverai-enterprise:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|REPLACE_WITH_ECR_URL:latest|${IMAGE_URI}|g" terraform/k8s/deployment.yaml
          sed -i "s|REPLACE_WITH_IRSA_ROLE_ARN|${{ secrets.IRSA_ROLE_ARN }}|g" terraform/k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f terraform/k8s/namespace.yaml
          kubectl apply -f terraform/k8s/deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/recoverai-api       -n recoverai --timeout=300s
          kubectl rollout status deployment/recoverai-dashboard -n recoverai --timeout=300s

      - name: Smoke test deployed API
        run: |
          # Wait for LoadBalancer IP
          for i in $(seq 1 30); do
            LB=$(kubectl get svc recoverai-api-svc -n recoverai \
                   -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$LB" ]; then
              echo "LoadBalancer: $LB"
              curl -sf "http://${LB}/health" && echo "Health check PASSED" && break
            fi
            echo "Waiting for LB... ($i/30)"
            sleep 10
          done
