name: RecoverAI Enterprise CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: recoverai-enterprise

jobs:
  # ── Quality Gate ─────────────────────────────────────────────────────────────
  quality:
    name: Syntax & Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          for f in recover_ai/config.py recover_ai/security.py recover_ai/database.py \
                   recover_ai/schemas.py recover_ai/ml_scorer.py recover_ai/agent_engine.py \
                   recover_ai/queue_worker.py recover_ai/main.py recover_ai/app.py \
                   recover_ai/data_simulator.py streamlit_app.py; do
            python -m py_compile "$f" && echo "OK: $f"
          done

      - name: Import smoke test
        working-directory: recover_ai
        run: |
          python -c "from config import get_settings; s=get_settings(); print('config OK:', s.app_version)"
          python -c "from schemas import PaymentFailurePayload, RecoveryAction; print('schemas OK')"
          python -c "import database; print('database OK')"
          python -c "from security import redact_pii, verify_razorpay_signature; print('security OK')"
          python -c "from ml_scorer import MLRecoveryScorer; s=MLRecoveryScorer.get(); print('ML scorer OK, score:', s.score(5000,'GATEWAY_ERROR',0,14))"

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push on PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Push to Docker Hub (main only) ───────────────────────────────────────────
  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
